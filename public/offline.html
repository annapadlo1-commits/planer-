<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1F2A27">
  <title>Brak połączenia • SZAFUNEK</title>
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#F6F4EF;color:#1F2A27}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 0,rgba(166,179,160,.36),transparent 30rem),#F6F4EF}
    main{width:min(480px,100%);padding:32px;border:2px solid #1F2A27;background:#F7F3EC;box-shadow:6px 7px 0 #A6B3A0;text-align:center}
    img{display:block;width:72px;height:72px;margin:0 auto 20px;object-fit:contain}
    .eyebrow{margin:0;color:#55665A;font:700 12px/1.4 "Courier New",monospace;letter-spacing:.12em}
    h1{margin:10px 0 14px;font-size:clamp(28px,7vw,40px);line-height:1;letter-spacing:-.04em}
    p{margin:0;color:#55665A;font-size:15px;line-height:1.65}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:24px;padding:0 20px;border:2px solid #1F2A27;color:#F7F3EC;background:#1F2A27;font-weight:800;text-decoration:none;box-shadow:3px 4px 0 #879681}
    a:focus-visible{outline:3px solid #C96F54;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/szafunek-192.png" alt="">
    <p class="eyebrow">SZAFUNEK • TRYB OFFLINE</p>
    <h1>Brak połączenia z internetem</h1>
    <p>Sprawdź sieć i spróbuj ponownie. Ze względów bezpieczeństwa grafik i dane firmy nie są przechowywane offline.</p>
    <a href="/">Spróbuj ponownie</a>
  </main>
</body>
</html>
