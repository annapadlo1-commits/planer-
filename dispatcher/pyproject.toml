[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "grafik-dispatcher"
version = "0.1.0"
description = "One-shot Cloud Run dispatcher for the Grafik Pro v2 solver"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-cloud-run==0.16.1",
  "gunicorn==23.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grafik_dispatcher = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
