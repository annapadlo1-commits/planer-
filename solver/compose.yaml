services:
  solver:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_ID: ${WORKER_ID:-grafik-pro-worker-1}
      SOLVER_VERSION: ${SOLVER_VERSION:?SOLVER_VERSION is required}
      WORKER_TASK_ATTEMPT: ${WORKER_TASK_ATTEMPT:-1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      MAX_RUNS: ${MAX_RUNS:-0}
      IDLE_EXIT_SECONDS: ${IDLE_EXIT_SECONDS:-0}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-20}
      LEASE_SECONDS: ${LEASE_SECONDS:-90}
      SOLVER_MAX_SECONDS: ${SOLVER_MAX_SECONDS:-300}
      SOLVER_FINALIZATION_RESERVE_SECONDS: ${SOLVER_FINALIZATION_RESERVE_SECONDS:-30}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
