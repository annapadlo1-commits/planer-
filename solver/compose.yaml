services:
  solver:
    build:
      context: .
    restart: "no"
    env_file:
      - .env
    environment:
      WORKER_ID: ${WORKER_ID:-grafik-pro-worker-1}
      SOLVER_VERSION: ${SOLVER_VERSION:?SOLVER_VERSION is required}
      RUN_ID: ${RUN_ID:?RUN_ID is required}
      DISPATCH_TOKEN: ${DISPATCH_TOKEN:?DISPATCH_TOKEN is required}
      DISPATCH_ATTEMPT: ${DISPATCH_ATTEMPT:?DISPATCH_ATTEMPT is required}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-20}
      LEASE_SECONDS: ${LEASE_SECONDS:-90}
      SOLVER_MAX_SECONDS: ${SOLVER_MAX_SECONDS:-300}
      SOLVER_FINALIZATION_RESERVE_SECONDS: ${SOLVER_FINALIZATION_RESERVE_SECONDS:-30}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
