name: Alpha 16 release gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-gateway:
    name: Web, TypeScript and gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:matrix-import
      - run: npm run test:uat006
      - run: node --test supabase/functions/solver-gateway/contract.test.mjs
      - run: npm run build

  solver:
    name: OR-Tools solver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            solver/requirements.txt
            solver/requirements-test.txt
      - run: python -m pip install --requirement solver/requirements-test.txt
      - run: python -m pytest solver/tests -v
        env:
          PYTHONPATH: solver/src
